name: Publish invoice-registration-reference 0.1.1 to PyPI

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pypi-invoice-registration-reference-0.1.1
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/invoice-registration-reference/0.1.1/
    permissions:
      id-token: write
    steps:
      - name: Retrieve and verify the reviewed distributions
        shell: bash
        run: |
          mkdir -p dist
          blob_url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/blobs"
          curl --fail --silent --show-error --retry 3 --max-time 45 \
            --header 'Accept: application/vnd.github.raw+json' \
            "$blob_url/27c59f7ae576f75c34201092e4babe9aa555628a" \
            --output dist/invoice_registration_reference-0.1.1-py3-none-any.whl
          curl --fail --silent --show-error --retry 3 --max-time 45 \
            --header 'Accept: application/vnd.github.raw+json' \
            "$blob_url/1204956c2fea2b4eab02bb2773e99e5d1e348f0e" \
            --output dist/invoice_registration_reference-0.1.1.tar.gz
          sha256sum --check <<'SHA256SUMS'
          b62e8e88763b964204e9ce97c906b8113b1d99e1712985031223b42d1de01427  dist/invoice_registration_reference-0.1.1-py3-none-any.whl
          c7d2a52f7fb9f58b76b88f05de984935addc3cd58df8612af9740bcb124faa5a  dist/invoice_registration_reference-0.1.1.tar.gz
          SHA256SUMS
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
